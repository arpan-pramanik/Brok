name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-checks:
    name: Rust Backend Microservices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Orchestrator
        run: cargo check --manifest-path services/orchestrator/Cargo.toml

      - name: Check Retrieval Service
        run: cargo check --manifest-path services/retrieval-service/Cargo.toml

      - name: Check ASR Service
        run: cargo check --manifest-path services/asr-service/Cargo.toml

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  python-checks:
    name: Python Indexing & Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python scripts syntax
        run: |
          python3 -m py_compile services/indexing-service/src/*.py services/orchestrator/*.py || true

