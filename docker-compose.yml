services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  retrieval:
    build:
      context: ./services/retrieval-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=msmarco_xi
      - OMP_NUM_THREADS=16
      - RAYON_NUM_THREADS=16
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - qdrant
    restart: unless-stopped

  generation:
    build:
      context: ./services/generation-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - /home/ubuntu/.aws:/root/.aws:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  asr:
    build:
      context: ./services/asr-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RETRIEVAL_URL=http://retrieval:8002
      - GENERATION_URL=http://generation:8004
      - ASR_URL=http://asr:8001
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - retrieval
      - generation
      - asr
    restart: unless-stopped

volumes:
  qdrant_data:
