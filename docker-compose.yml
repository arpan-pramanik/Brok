services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  retrieval:
    build:
      context: ./services/retrieval-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=msmarco_xi
      - OMP_NUM_THREADS=16
      - RAYON_NUM_THREADS=16
      - FASTEMBED_CACHE_DIR=/tmp/fastembed_cache
    volumes:
      - /tmp/fastembed_cache:/tmp/fastembed_cache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - qdrant
    restart: unless-stopped

  generation:
    build:
      context: ./services/generation-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  asr:
    build:
      context: ./services/asr-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RETRIEVAL_URL=http://retrieval:8002
      - GENERATION_URL=http://generation:8004
      - ASR_URL=http://asr:8001
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_SECONDARY=${GROQ_API_KEY_SECONDARY}
      - GROQ_MODEL=${GROQ_MODEL:-allam-2-7b}
      - GROQ_MODEL_2=${GROQ_MODEL_2:-allam-2-7b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct}
      - ABSTAIN_THRESHOLD=${ABSTAIN_THRESHOLD:-0.30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - retrieval
      - generation
      - asr
    restart: unless-stopped

volumes:
  qdrant_data:
