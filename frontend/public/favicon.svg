<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="topGlow" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ff4b55"/>
      <stop offset="70%" stop-color="#e31b23"/>
      <stop offset="100%" stop-color="#990b12"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="35%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#eaeaea"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Border -->
  <circle cx="50" cy="50" r="48" fill="#111111"/>
  
  <!-- Top Red Semicircle -->
  <path d="M 5 50 A 45 45 0 0 1 95 50 Z" fill="url(#topGlow)"/>
  
  <!-- Bottom White Semicircle -->
  <path d="M 5 50 A 45 45 0 0 0 95 50 Z" fill="url(#bottomGlow)"/>
  
  <!-- Center Horizontal Black Belt -->
  <rect x="5" y="45" width="90" height="10" fill="#111111"/>
  
  <!-- Center Outer Black Ring -->
  <circle cx="50" cy="50" r="19" fill="#111111" filter="url(#shadow)"/>
  
  <!-- Center White Button Core -->
  <circle cx="50" cy="50" r="14" fill="#ffffff"/>
  <circle cx="50" cy="50" r="13" fill="none" stroke="#222222" stroke-width="1.5"/>
  
  <!-- Bold Stylized Letter B in the Core -->
  <text x="50" y="57" font-family="'Pokemon Solid', 'Arial Black', Impact, sans-serif" font-size="17" font-weight="900" text-anchor="middle" fill="#111111" letter-spacing="-0.5">B</text>
</svg>