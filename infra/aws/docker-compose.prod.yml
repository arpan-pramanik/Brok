version: '3.8'

services:
  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASR_URL=http://asr-service:8001
      - RETRIEVAL_URL=http://retrieval-service:8002
      - GUARDRAIL_URL=http://guardrail-service:8003
      - GENERATION_URL=http://generation-service:8004
      - TTS_URL=http://tts-service:8005
    depends_on:
      - asr-service
      - retrieval-service
      - guardrail-service
      - generation-service
      - tts-service
    restart: always

  asr-service:
    build:
      context: ../..
      dockerfile: services/asr-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  retrieval-service:
    build:
      context: ../..
      dockerfile: services/retrieval-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - S3_BUCKET=bragi-msmarco-xi-dataset
      - AWS_DEFAULT_REGION=ap-south-1
    depends_on:
      - qdrant
    restart: always

  guardrail-service:
    build:
      context: ../..
      dockerfile: services/guardrail-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - ABSTAIN_THRESHOLD=-9.0
    restart: always

  generation-service:
    build:
      context: ../..
      dockerfile: services/generation-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ENVIRONMENT=production
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: always

  tts-service:
    build:
      context: ../..
      dockerfile: services/tts-service/Dockerfile
    ports:
      - "8005:8005"
    restart: always

volumes:
  qdrant_data:
