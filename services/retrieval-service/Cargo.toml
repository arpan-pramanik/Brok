[package]
name = "retrieval-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
fastembed = "6.0.0"
qdrant-client = "1.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = "1.24.1"
rusqlite = { version = "0.32", features = ["bundled"] }
